name: Fork Infrastructure Check

# Only run on PR creation (opened), never on subsequent pushes/edits,
# so we post at most one comment per PR.
on:
  pull_request_target:
    types: [opened]
    paths:
      - 'eng/**'
      - '.github/**'

permissions:
  pull-requests: write

jobs:
  check-fork-infra:
    name: Check fork PRs touching infrastructure
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Post advisory comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '> [!NOTE]',
                '> **This PR is from a fork and modifies infrastructure files** (`eng/` or `.github/`).',
                '>',
                '> Infrastructure changes are best proposed from a branch in this repository when the contributor has write access, so CI workflows can use the repository's configured permissions and secrets.',
                '>',
                '> Please consider recreating this PR from a branch in this repository. If you do not have write access, ask a maintainer to help move the change onto a trusted branch.'
              ].join('\n')
            });
