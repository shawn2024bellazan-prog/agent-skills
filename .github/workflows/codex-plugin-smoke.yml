name: codex-plugin-smoke

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/*/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"
      - "plugins/*/version.json"
      - "plugins/*/.mcp.json"
      - "plugins/*/mcp.json"
      - "plugins/*/skills/**"
      - "eng/codex/**"
      - ".github/workflows/codex-plugin-smoke.yml"
  push:
    branches: [master]
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/*/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"
      - "plugins/*/version.json"
      - "plugins/*/.mcp.json"
      - "plugins/*/mcp.json"
      - "plugins/*/skills/**"
      - "eng/codex/**"
      - ".github/workflows/codex-plugin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Codex CLI
        env:
          CODEX_SHA256: a0bf572d2f93f056c6712a6da348e96078dc84f3885fd7be67807ef389cb3978
          CODEX_VERSION: 0.166.0
        shell: bash
        run: |
          mkdir -p artifacts/codex-cli
          curl -fsSLo artifacts/codex-cli/codex.tar.gz \
            "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/codex-x86_64-unknown-linux-musl.tar.gz"
          echo "${CODEX_SHA256}  artifacts/codex-cli/codex.tar.gz" | sha256sum -c -
          tar -xzf artifacts/codex-cli/codex.tar.gz -C artifacts/codex-cli
          mv artifacts/codex-cli/codex-x86_64-unknown-linux-musl artifacts/codex-cli/codex
          chmod +x artifacts/codex-cli/codex

      # This verifies marketplace installation and skill discovery without model inference.
      - name: Run credential-free Codex plugin installation and skill discovery smoke test
        run: node eng/codex/codex-plugin-smoke.mjs --codex "${{ github.workspace }}/artifacts/codex-cli/codex"
